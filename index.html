const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=document.getElementById('pw').value;
  if(!pw)return;
  document.getElementById('loading').style.display='block';
  document.getElementById('err').style.display='none';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:200000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},k,b(CT));
    const html=new TextDecoder().decode(plain);
    sessionStorage.setItem("_bpak_pw",pw);document.open();document.write(html);document.close();
  }catch{
    document.getElementById('loading').style.display='none';
    document.getElementById('err').style.display='block';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
