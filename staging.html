<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0d0f14;font-family:system-ui,sans-serif;}
  .ver{position:fixed;top:12px;right:16px;font-size:10px;color:#3a4060;letter-spacing:.04em;}
  .ver-staging{color:#f59e0b;font-weight:700;}
  .box{background:#161920;border:1px solid #2a2f42;border-radius:10px;
        padding:32px 36px;width:340px;display:flex;flex-direction:column;gap:16px;}
  h2{color:#e8eaf0;font-size:15px;font-weight:600;letter-spacing:.04em;text-align:center;}
  input{background:#1e2230;border:1px solid #3a4060;border-radius:6px;
         padding:10px 14px;color:#e8eaf0;font-size:14px;width:100%;outline:none;}
  input:focus{border-color:#4a9eff;}
  button{background:#4a9eff;color:#fff;border:none;border-radius:6px;
          padding:10px;font-size:14px;font-weight:600;cursor:pointer;width:100%;}
  button:hover{background:#2d6fd4;}
  .err{color:#ef4444;font-size:12px;text-align:center;display:none;}
  .loading{color:#8891aa;font-size:12px;text-align:center;display:none;}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=document.getElementById('pw').value;
  if(!pw)return;
  document.getElementById('loading').style.display='block';
  document.getElementById('err').style.display='none';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:200000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},k,b(CT));
    const html=new TextDecoder().decode(plain);
    sessionStorage.setItem("_bpak_pw",pw);document.open();document.write(html);document.close();
  }catch{
    document.getElementById('loading').style.display='none';
    document.getElementById('err').style.display='block';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
</script>
